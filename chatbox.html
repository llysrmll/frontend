<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Assistance - KapwaHiram</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="top-nav">
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="rental.html">Rentals</a>
      <a href="delivery.html">Delivery</a>
      <a href="chatbox.html">Messages</a>
      <a href="profile.html">Profile</a>
    </div>
    <div class="nav-actions">
      <div class="nav-chat-input">
        <input id="navChatInput" type="text" placeholder="Ask chat...">
        <button type="button" id="navChatButton">➤</button>
      </div>
      <button type="button" class="nav-button" id="navNotificationBtn">Notifications</button>
    </div>
  </nav>
  <div class="container chat-layout">
    <aside class="side-panel">
      <h3>Notifications</h3>
      <button type="button" id="chatViewAllBtn">View All</button>
      <button type="button" id="chatNewReqBtn">New Request</button>
      <button type="button" id="chatPostItemBtn">Post Item</button>
      <div class="notification-list">
        <h4>Recent</h4>
        <ul id="chatNotifications"></ul>
      </div>
    </aside>
    <div class="chatbox chatbox-with-info">
      <div class="chat-header">
        <div class="chat-avatar">B</div>
        <div class="chat-info">
          <h2>User Messages</h2>
          <span>Connect with support or view your recent chats</span>
        </div>
        <div class="chat-user-actions">
          <span class="chat-user-name">User: Event Partner</span>
          <button type="button" class="chat-action-button">New Chat</button>
        </div>
      </div>
      <div class="chat-window">
        <div class="message bot">
          <div class="message-text">Hi! How can I assist you today?</div>
        </div>
        <div class="message user">
          <div class="message-text">Admin is currently unavailable. You can post your rental item below.</div>
        </div>
      </div>
      <form class="chat-form" id="chatForm">
        <input type="text" placeholder="Type a message..." autocomplete="off">
        <button type="submit">➤</button>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
